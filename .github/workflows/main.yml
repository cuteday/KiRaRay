name: Building

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: CUDA ${{ matrix.config.cuda }} / OptiX ${{ matrix.config.optix }} / spectral ${{ matrix.spectral }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        spectral: ["ON", "OFF"]
        config:
          # CUDA 12.5 requires an older host compiler than the runner's default.
          - cuda: "12.5.0"
            toolset: "v142,version=14.29"
            optix: "8.0.0"
            optix_ref: f60c1e44f18426f426a2ed948f28515b3cf67b8a
          - cuda: "13.2.0"
            toolset: "v143,version=14.44"
            optix: "9.1.0"
            optix_ref: f1f6dd803f3159992d248178f6e09421c6eb8b6d

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 4GB
          maximum-size: 16GB

      - name: Checkout KiRaRay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Checkout OptiX headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/optix-dev
          ref: ${{ matrix.config.optix_ref }}
          path: optix

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep the bundled pybind11 2.11 on a supported Python version.
          python-version: "3.11"
          architecture: x64

      - name: Install CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.31.6"
          ninjaVersion: "1.13.2"

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.config.cuda }}
          method: local
          log-file-suffix: cuda-${{ matrix.config.cuda }}-spectral-${{ matrix.spectral }}.txt

      - name: Check CUDA compiler
        run: nvcc --version

      - name: Install Vulkan SDK
        # The SDK contains multiple embedded archives. Extracting the EXE with
        # 7-Zip only produced Bin/, leaving out the headers and import libraries.
        run: |
          $version = '1.4.313.1'
          $sha256 = '2ce4c7b226d025c3be836ff667bd70c6764f407c69738c31e360dcb6352a34db'
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK/$version"
          if (-not (Test-Path -LiteralPath $installer)) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          }
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $sha256) {
            throw 'Vulkan SDK installer SHA256 mismatch.'
          }

          # Use LunarG's unattended installer without changing system settings.
          $installLog = Join-Path $env:RUNNER_TEMP 'vulkan-install.log'
          $errorLog = Join-Path $env:RUNNER_TEMP 'vulkan-install-error.log'
          $arguments = @('--root', "`"$sdkRoot`"", '--accept-licenses', '--default-answer',
            '--confirm-command', 'install', 'copy_only=1')
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $installLog -RedirectStandardError $errorLog
          if ($process.ExitCode -ne 0) {
            Get-Content -LiteralPath $installLog, $errorLog -Tail 80
            throw "Vulkan SDK installation failed: $($process.ExitCode)"
          }

          $requiredFiles = @('Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib',
            'Include/dxc/dxcapi.h', 'Lib/dxcompiler.lib', 'Bin/dxc.exe', 'Bin/dxcompiler.dll')
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $sdkRoot $file) -PathType Leaf)) {
              throw "Vulkan SDK installation is incomplete: missing $file in $sdkRoot"
            }
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "Vulkan SDK $version installed and verified at $sdkRoot"

      - name: Configure CMake
        # Hosted runners have no NVIDIA GPU, so do not use native detection.
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -T "${{ matrix.config.toolset }},host=x64,cuda=$env:CUDA_PATH"
          "-DCUDAToolkit_ROOT=$env:CUDA_PATH"
          -DCMAKE_CUDA_ARCHITECTURES=75-virtual
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          "-DOptiX_INSTALL_DIR=$env:GITHUB_WORKSPACE/optix"
          "-DPython_EXECUTABLE=$env:pythonLocation/python.exe"
          -DKRR_RENDER_SPECTRAL=${{ matrix.spectral }}
          -DKRR_ENABLE_D3D12=ON
          -DBUILD_TESTING=ON -DKRR_ENABLE_GPU_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2

      - name: CPU tests
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} -L cpu --output-on-failure --output-junit cpu-tests.xml
